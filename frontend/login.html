<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · EcoRAEE Cloud</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login">
    <section class="escena" aria-label="Presentación">
      <div class="marca-login"><span id="logo"></span>EcoRAEE</div>
      <h1>Cada equipo cuenta</h1>
      <p>Inicie sesión y siga la ruta de cada aparato hasta su nueva vida.</p>
    </section>
    <section class="lado-form">
      <div class="caja">
        <h2>Ingrese a su cuenta</h2>
        <form id="form-login" novalidate>
          <div class="campo">
            <label for="correo">Correo institucional</label>
            <div class="control" id="c-correo">
              <input id="correo" name="correo" type="email" autocomplete="username" required maxlength="150" placeholder="Escriba su correo">
            </div>
            <span class="msg" aria-live="polite"></span>
          </div>
          <div class="campo" style="margin-top:16px">
            <label for="password">Contraseña</label>
            <div class="control" id="c-pass">
              <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="100" placeholder="Escriba su contraseña">
              <button type="button" class="ojo" id="ver" aria-label="Mostrar contraseña"></button>
            </div>
            <span class="msg" aria-live="polite"></span>
          </div>
          <div class="olvido"><button type="button" id="olvido">¿Olvidó su contraseña?</button></div>
          <div class="aviso error" id="error" hidden style="margin-top:16px"></div>
          <button class="btn entrar" type="submit" id="entrar">Iniciar sesión</button>
        </form>
        <div class="separador">o pruebe un rol</div>
        <label class="sr-only" for="demo">Usuario de prueba</label>
        <select class="demo" id="demo">
          <option value="">Elegir un usuario de prueba…</option>
          <option value="admin@ecoraee.test">Administrador</option>
          <option value="gen1@ecoraee.test">Generador (estudiante)</option>
          <option value="ope1@ecoraee.test">Operador de centro</option>
          <option value="tec1@ecoraee.test">Técnico evaluador</option>
          <option value="coo1@ecoraee.test">Coordinador logístico</option>
          <option value="rea1@ecoraee.test">Reacondicionador (taller)</option>
          <option value="rec1@ecoraee.test">Gestor de reciclaje</option>
          <option value="ben1@ecoraee.test">Entidad beneficiaria</option>
        </select>
        <p class="pie-login">Usuarios de prueba: contraseña <b>EcoRaee2026!</b></p>
      </div>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
