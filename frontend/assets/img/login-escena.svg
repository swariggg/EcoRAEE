<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Ilustración original de EcoRAEE: un brote crece en una maceta junto a equipos que se reutilizan -->
  <defs>
    <linearGradient id="pared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9AC96"/>
      <stop offset=".55" stop-color="#C9BCA6"/>
      <stop offset="1" stop-color="#D7CCB8"/>
    </linearGradient>
    <radialGradient id="luz" cx=".78" cy=".25" r=".7">
      <stop offset="0" stop-color="#F3EBDD" stop-opacity=".75"/>
      <stop offset="1" stop-color="#F3EBDD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6A40"/>
      <stop offset="1" stop-color="#6E4628"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4F2E"/>
      <stop offset="1" stop-color="#4E311C"/>
    </linearGradient>
    <linearGradient id="maceta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9652F"/>
      <stop offset=".5" stop-color="#DE7D45"/>
      <stop offset="1" stop-color="#B85A28"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DBB6A"/>
      <stop offset="1" stop-color="#5E7D33"/>
    </linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4A33"/>
      <stop offset="1" stop-color="#253021"/>
    </linearGradient>
    <pattern id="tejido" width="10" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q2.5 0 5 4 T10 4" fill="none" stroke="#A84E20" stroke-opacity=".35" stroke-width="1.4"/>
    </pattern>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="900" height="1000" fill="url(#pared)"/>
  <rect width="900" height="1000" fill="url(#luz)"/>

  <!-- ramas secas en un jarrón (izquierda, como la referencia) -->
  <g stroke="#7B6248" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M70 640 C60 520 40 430 20 330"/>
    <path d="M78 640 C90 520 110 450 150 360"/>
    <path d="M74 640 C70 560 80 480 70 400"/>
    <path d="M60 470 C40 450 25 440 5 438"/>
    <path d="M98 500 C120 470 140 460 175 455"/>
  </g>
  <g fill="#8A7055" opacity=".85">
    <circle cx="20" cy="330" r="5"/><circle cx="30" cy="350" r="4"/><circle cx="12" cy="360" r="4"/>
    <circle cx="150" cy="360" r="5"/><circle cx="140" cy="380" r="4"/><circle cx="162" cy="378" r="4"/>
    <circle cx="70" cy="400" r="5"/><circle cx="60" cy="418" r="4"/><circle cx="82" cy="420" r="4"/>
    <circle cx="5" cy="438" r="4"/><circle cx="175" cy="455" r="4"/><circle cx="160" cy="448" r="3"/>
    <circle cx="44" cy="300" r="3"/><circle cx="120" cy="420" r="3"/>
  </g>
  <path d="M38 640 C30 700 40 760 74 772 C108 760 118 700 110 640 C104 625 44 625 38 640 Z" fill="#D9D1C2"/>
  <path d="M46 650 C42 700 50 748 74 758" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>

  <!-- mesa de madera -->
  <ellipse cx="560" cy="790" rx="520" ry="70" fill="#3A2716" opacity=".35" filter="url(#sombra)"/>
  <path d="M-20 760 Q450 690 960 760 L960 1000 L-20 1000 Z" fill="url(#mesa)"/>
  <path d="M-20 760 Q450 690 960 760" fill="none" stroke="#B88456" stroke-width="3" opacity=".6"/>
  <g stroke="#5C3A20" stroke-opacity=".25" stroke-width="2" fill="none">
    <path d="M0 820 Q300 790 900 830"/><path d="M0 870 Q420 840 900 880"/><path d="M0 930 Q380 905 900 940"/>
  </g>
  <rect x="-20" y="960" width="980" height="40" fill="url(#borde)"/>

  <!-- laptop vieja abierta (al fondo) -->
  <g transform="translate(560 520)">
    <ellipse cx="150" cy="232" rx="190" ry="18" fill="#2B1C10" opacity=".35" filter="url(#sombra)"/>
    <path d="M10 60 L290 40 L300 210 L20 222 Z" fill="#6E7564"/>
    <path d="M24 72 L278 54 L286 198 L32 208 Z" fill="url(#pantalla)"/>
    <path d="M60 100 L150 94 M60 120 L200 112 M60 140 L170 134" stroke="#9DBB6A" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
    <circle cx="232" cy="150" r="26" fill="none" stroke="#9DBB6A" stroke-opacity=".7" stroke-width="5"/>
    <path d="M232 132 l8 10 h-16 z" fill="#9DBB6A" fill-opacity=".8"/>
    <path d="M-10 222 L320 208 L340 232 L-20 248 Z" fill="#8C9380"/>
    <path d="M120 226 L190 223" stroke="#6E7564" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- maceta tejida con el brote (protagonista, como en la referencia) -->
  <g transform="translate(330 560)">
    <ellipse cx="85" cy="232" rx="120" ry="16" fill="#2B1C10" opacity=".4" filter="url(#sombra)"/>
    <path d="M0 110 L170 110 L150 228 Q85 244 20 228 Z" fill="url(#maceta)"/>
    <path d="M0 110 L170 110 L150 228 Q85 244 20 228 Z" fill="url(#tejido)"/>
    <rect x="-8" y="92" width="186" height="30" rx="14" fill="#D9733A"/>
    <rect x="-8" y="92" width="186" height="30" rx="14" fill="url(#tejido)"/>
    <ellipse cx="85" cy="96" rx="84" ry="10" fill="#5A3A22"/>
    <!-- tallo y hojas -->
    <path d="M86 96 C84 60 88 30 92 2" stroke="#6F8F3D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M90 14 C60 -40 -10 -40 -10 6 C-10 46 60 40 90 14 Z" fill="url(#hoja)"/>
    <path d="M94 10 C120 -48 200 -46 204 2 C206 44 130 44 94 10 Z" fill="url(#hoja)"/>
    <path d="M86 12 C60 -6 30 -8 8 0" stroke="#4F6B2A" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M98 8 C126 -10 160 -12 186 -2" stroke="#4F6B2A" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- detalle de circuito en la maceta: el equipo viejo alimenta algo nuevo -->
    <g stroke="#F6D6B8" stroke-opacity=".6" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M40 150 h28 v24 h30"/><path d="M130 140 v30 h-20"/><path d="M60 200 h50"/>
    </g>
    <g fill="#F6D6B8" fill-opacity=".8"><circle cx="40" cy="150" r="5"/><circle cx="98" cy="174" r="5"/><circle cx="130" cy="140" r="5"/><circle cx="110" cy="200" r="5"/></g>
  </g>

  <!-- celular viejo apoyado -->
  <g transform="translate(560 690) rotate(-8)">
    <rect x="0" y="0" width="70" height="128" rx="12" fill="#3E463A"/>
    <rect x="7" y="12" width="56" height="96" rx="5" fill="#253021"/>
    <circle cx="35" cy="118" r="4" fill="#6E7564"/>
    <path d="M18 50 l12 12 l24 -26" stroke="#9DBB6A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  </g>
</svg>
