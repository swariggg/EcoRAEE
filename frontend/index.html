<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoRAEE Cloud</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral" aria-label="Menú principal"></aside>
    <div class="principal">
      <header class="barra">
        <button class="btn-icono menu-movil" id="abrir-menu" aria-label="Abrir menú"></button>
        <form class="buscador" id="buscador" role="search">
          <label class="sr-only" for="q">Buscar equipo</label>
          <input id="q" placeholder="Buscar equipo por código, QR o número de serie (p. ej. DSP-005)" autocomplete="off">
        </form>
        <div class="derecha" id="derecha"></div>
      </header>
      <main class="contenido" id="vista" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
